description: >
  Fetch Trivy's vulnerability database, Java database and checks bundle once,
  and scan with them in later jobs, in parallel and without reaching Trivy's
  registries, such as on runners without internet access. Each scan fails
  when the database is more than max_db_age_days old. db_repository points
  fetch_db at an internal mirror of mirror.gcr.io/aquasec/trivy-db.

usage:
  version: 2.1
  orbs:
    trivy: juburr/trivy-orb@0.1.0
  jobs:
    fetch-databases:
      docker:
        - image: cimg/base:current
      steps:
        - trivy/install
        - trivy/fetch_db:
            cache_dir: /tmp/workspace/trivy
            java_db: true
            checks_bundle: true
        - persist_to_workspace:
            root: /tmp/workspace
            paths: [trivy]
    scan-image:
      docker:
        - image: cimg/base:current
      steps:
        - attach_workspace:
            at: /tmp/workspace
        - trivy/install
        - trivy/scan:
            target: ghcr.io/my-org/my-app:1.0
            cache_dir: /tmp/workspace/trivy
            offline: true
            max_db_age_days: 2
    scan-config:
      docker:
        - image: cimg/base:current
      steps:
        - checkout
        - attach_workspace:
            at: /tmp/workspace
        - trivy/install
        - trivy/scan:
            target_type: config
            target: deploy
            cache_dir: /tmp/workspace/trivy
            offline: true
  workflows:
    scan:
      jobs:
        - fetch-databases
        - scan-image:
            requires: [fetch-databases]
        - scan-config:
            requires: [fetch-databases]
