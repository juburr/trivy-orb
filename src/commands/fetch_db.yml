description: >
  Fetches Trivy's vulnerability database into cache_dir, and on request its
  Java database and misconfiguration checks bundle, and points the job's
  later steps at them through TRIVY_CACHE_DIR. Scans in the same job then
  use them without updating them, so parallel scans never download over each
  other. With caching, the databases are restored from and saved to
  CircleCI's cache, so jobs download them only when a newer build exists.
  Persist cache_dir to the workspace to scan offline in later jobs. Run
  install first.
parameters:
  cache_dir:
    type: string
    default: "~/.cache/trivy"
    description: >
      Trivy's cache directory, to fetch the databases into. A leading ~ is
      expanded to $HOME, and a relative path is resolved against the working
      directory. It is exported as TRIVY_CACHE_DIR, which later trivy
      commands read. With caching, this directory is restored and saved as
      given. Environment variables are expanded, but not by the cache steps,
      so use them only with caching off.
  java_db:
    type: boolean
    default: false
    description: >
      Also fetch the Java database, which Trivy needs to identify JAR, WAR
      and EAR files in images and root filesystems. It is large, so it is
      only fetched when asked for; otherwise a scan that finds a JAR fetches
      it then.
  checks_bundle:
    type: boolean
    default: false
    description: >
      Also fetch the misconfiguration checks bundle, for offline
      misconfiguration scans. Online, scans fetch it themselves.
  db_repository:
    type: string
    default: ""
    description: >
      The vulnerability database's OCI repositories, tried in order and
      separated by commas, such as a mirror of mirror.gcr.io/aquasec/trivy-db:2
      in Artifactory or Harbor, passed as --db-repository and exported as
      TRIVY_DB_REPOSITORY for later scans. Leave empty for Trivy's defaults,
      mirror.gcr.io/aquasec/trivy-db:2 then ghcr.io/aquasecurity/trivy-db:2.
      Environment variables are expanded.
  java_db_repository:
    type: string
    default: ""
    description: >
      The Java database's OCI repositories, as db_repository, passed as
      --java-db-repository and exported as TRIVY_JAVA_DB_REPOSITORY. Leave
      empty for Trivy's defaults, mirror.gcr.io/aquasec/trivy-java-db:1 then
      ghcr.io/aquasecurity/trivy-java-db:1. Environment variables are
      expanded.
  checks_bundle_repository:
    type: string
    default: ""
    description: >
      The checks bundle's OCI repository, passed as
      --checks-bundle-repository and exported as
      TRIVY_CHECKS_BUNDLE_REPOSITORY. Leave empty for Trivy's default,
      mirror.gcr.io/aquasec/trivy-checks:2. Environment variables are
      expanded.
  max_db_age_days:
    type: integer
    default: 7
    description: >
      Fail when the vulnerability database is more than this many days old
      after fetching, as one from a stalled mirror can be. 0 means no limit.
  timeout:
    type: string
    default: ""
    description: >
      How long each download may take, such as 15m, passed as --timeout.
      Leave empty for Trivy's 5m.
  caching:
    type: boolean
    default: true
    description: >
      Cache the databases between jobs. Jobs reuse the cached databases until
      a newer build is published, and the first job to download it caches it
      for the rest, so a slow or rate-limited registry is hit less. The
      vulnerability database takes roughly 100 MiB of cache storage per
      build saved, and the Java database several hundred more.
steps:
  - when:
      condition: << parameters.caching >>
      steps:
        # A saved cache is never replaced, so the databases are saved under a
        # key naming them and their build date, and the newest databases built
        # today, then on the two days before, then any are restored (see
        # scripts/db_cache_key.sh).
        - run:
            name: Prepare Trivy database cache location
            environment:
              ORB_DB_CACHE_KEY_PART: location
              ORB_DB_CACHE_KEY_PREFIX: /tmp/trivy-orb-db-cache
              PARAM_CACHE_DIR: << parameters.cache_dir >>
              PARAM_CHECKS_BUNDLE: << parameters.checks_bundle >>
              PARAM_CHECKS_BUNDLE_REPOSITORY: << parameters.checks_bundle_repository >>
              PARAM_DB_REPOSITORY: << parameters.db_repository >>
              PARAM_JAVA_DB: << parameters.java_db >>
              PARAM_JAVA_DB_REPOSITORY: << parameters.java_db_repository >>
              SCRIPT_TRIVY_LIB: << include(scripts/lib/trivy.sh) >>
            command: << include(scripts/db_cache_key.sh) >>
        - restore_cache:
            keys:
              - trivy-orb-db-v1-{{ checksum "/tmp/trivy-orb-db-cache-location" }}-{{ checksum "/tmp/trivy-orb-db-cache-day0" }}-
              - trivy-orb-db-v1-{{ checksum "/tmp/trivy-orb-db-cache-location" }}-{{ checksum "/tmp/trivy-orb-db-cache-day1" }}-
              - trivy-orb-db-v1-{{ checksum "/tmp/trivy-orb-db-cache-location" }}-{{ checksum "/tmp/trivy-orb-db-cache-day2" }}-
              - trivy-orb-db-v1-{{ checksum "/tmp/trivy-orb-db-cache-location" }}-
  - run:
      name: Fetch Trivy databases
      environment:
        PARAM_CACHE_DIR: << parameters.cache_dir >>
        PARAM_CHECKS_BUNDLE: << parameters.checks_bundle >>
        PARAM_CHECKS_BUNDLE_REPOSITORY: << parameters.checks_bundle_repository >>
        PARAM_DB_REPOSITORY: << parameters.db_repository >>
        PARAM_JAVA_DB: << parameters.java_db >>
        PARAM_JAVA_DB_REPOSITORY: << parameters.java_db_repository >>
        PARAM_MAX_DB_AGE_DAYS: << parameters.max_db_age_days >>
        PARAM_TIMEOUT: << parameters.timeout >>
        SCRIPT_TRIVY_LIB: << include(scripts/lib/trivy.sh) >>
      command: << include(scripts/fetch_db.sh) >>
  - when:
      condition: << parameters.caching >>
      steps:
        - run:
            name: Prepare Trivy database cache key
            environment:
              ORB_DB_CACHE_KEY_PART: database
              ORB_DB_CACHE_KEY_PREFIX: /tmp/trivy-orb-db-cache
              PARAM_CACHE_DIR: << parameters.cache_dir >>
              SCRIPT_TRIVY_LIB: << include(scripts/lib/trivy.sh) >>
            command: << include(scripts/db_cache_key.sh) >>
        - save_cache:
            key: trivy-orb-db-v1-{{ checksum "/tmp/trivy-orb-db-cache-location" }}-{{ checksum "/tmp/trivy-orb-db-cache-built" }}-{{ checksum "/tmp/trivy-orb-db-cache-database" }}
            paths:
              - << parameters.cache_dir >>
